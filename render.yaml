# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Trie Autocomplete app as a single Docker web service that
# compiles the C++ engine, builds the frontend, and serves both.
services:
  - type: web
    name: trie-autocomplete
    runtime: docker            # if Render flags this, use: env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
